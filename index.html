<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>с др, опг минон роднуля🎉</title>
    <!-- Подключаем конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Желтый фон */
            background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
            overflow: hidden; /* Чтобы миньоны не вылезали за края */
            position: relative;
        }

        /* --- Плывущий фон с миньонами --- */
        .background-minions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Фон под карточкой */
            opacity: 0.2; /* Делаем их полупрозрачными */
            background-image: 
                url('https://media.tenor.com/71239O9p98AAAAAi/minion-minions.gif'),
                url('https://media.tenor.com/N2s132m82XAAAAAi/minion-what.gif');
            background-repeat: repeat;
            animation: moveBackground 20s linear infinite;
        }

        @keyframes moveBackground {
            from { background-position: 0 0; }
            to { background-position: 100% 100%; }
        }

        /* --- Основная карточка --- */
        .container {
            background: rgba(255, 255, 255, 0.95); /* Белая, почти непрозрачная */
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
            z-index: 1; /* Поверх фона */
            position: relative;
        }

        img.main-gif {
            max-width: 220px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 15px;
            display: block; /* Гарантирует, что она не схлопнется */
            margin-left: auto;
            margin-right: auto;
        }

        h1 { color: #fbc02d; font-size: 26px; margin: 10px 0; }
        h2 { font-size: 20px; color: #555; margin-bottom: 20px; }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            min-height: 60px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        #yesBtn { background-color: #4caf50; color: white; }
        #noBtn { background-color: #f44336; color: white; }

        /* --- Экран игры --- */
        #successScreen { display: none; }

        .game-box {
            position: relative;
            width: 100%;
            height: 200px;
            background: #e0f7fa; /* Голубое небо в игре */
            border-radius: 15px;
            border: 3px solid #fbc02d;
            overflow: hidden;
            margin-top: 15px;
            touch-action: manipulation;
            display: flex;
            align-items: flex-end; /* Все элементы игры на "земле" */
        }

        #minionRunner {
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 10px;
            left: 20px;
            /* Прыгающий миньон */
            background-image: url('https://media.tenor.com/71239O9p98AAAAAi/minion-minions.gif');
            background-size: cover;
            z-index: 2;
        }

        #cakeObstacle {
            width: 35px;
            height: 35px;
            position: absolute;
            bottom: 10px;
            right: -40px; /* Изначально за экраном */
            /* Тортик */
            background-image: url('https://media.tenor.com/83p1y3U0f1AAAAAi/birthday-cake.gif');
            background-size: cover;
            z-index: 1;
        }

        .jump { animation: jumpAnim 0.6s ease-out; }

        @keyframes jumpAnim {
            0% { bottom: 10px; }
            50% { bottom: 100px; }
            100% { bottom: 10px; }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Плывущий фон -->
    <div class="background-minions"></div>

    <!-- Основной экран открытки -->
    <div class="container" id="mainCard">
        <div>
            <!-- НОВАЯ ГИФКА: Праздничный миньон с тортом -->
            <img id="mainGif" class="main-gif" src="https://media.tenor.com/83p1y3U0f1AAAAAi/birthday-cake.gif" alt="Minion Birthday">
        </div>

        <h1>открытка для ари</h1>
        <h2>арыйагын чи не</h2>

        <div class="btn-group">
            <button id="yesBtn" onclick="acceptGreeting()">до)))</button>
            <button id="noBtn" onclick="rejectGreeting()">нит(((</button>
        </div>
    </div>

    <!-- Экран успеха с игрой -->
    <div class="container" id="successScreen">
        <h1>уроо с др тебя ари 🥳💛</h1>
        <p style="font-size: 18px;">желаю счастья и всего крутого</p>
        
        <p style="font-size: 14px; color: #666; margin-top: 20px;">тапай по голубому полю, шобы минон прыгал</p>

        <div class="score-board">
            <div>Счет: <span id="score">0</span></div>
            <div>Рекорд: <span id="highScore">0</span></div>
        </div>

        <!-- Игровое поле -->
        <div class="game-box" id="gameArea" onclick="jump()">
            <div id="minionRunner"></div>
            <div id="cakeObstacle"></div>
        </div>
    </div>

    <script>
        let yesScale = 1;
        let noClicks = 0;
        // Гифки, которые будут меняться при нажатии "Нет"
        const rejectGifs = [
            "https://media.tenor.com/N2s132m82XAAAAAi/minion-what.gif",
            "https://media.tenor.com/46V6T6Z_R6YAAAAAi/minions-shocked.gif",
            "https://media.tenor.com/9HMzOjXLdesAAAAi/ravenclaw-ravenclaw-cat.gif" // Котик
        ];

        function rejectGreeting() {
            // Увеличиваем кнопку "Да"
            yesScale += 0.3;
            document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;

            // Меняем гифку на недоумевающую, но НЕ прячем её
            const gifIndex = noClicks % rejectGifs.length;
            document.getElementById('mainGif').src = rejectGifs[gifIndex];
            
            noClicks++;
        }

        function acceptGreeting() {
            // Прячем открытку, показываем игру
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';

            // Бабах конфетти
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });

            // Запускаем игру
            startGame();
        }

        // --- Логика игры ---
        let score = 0;
        let highScore = 0;
        let isJumping = false;
        let gameInterval;

        function jump() {
            const minion = document.getElementById('minionRunner');
            if (!isJumping) {
                isJumping = true;
                minion.classList.add('jump');
                setTimeout(() => {
                    minion.classList.remove('jump');
                    isJumping = false;
                }, 600); // Время прыжка
            }
        }

        function startGame() {
            const cake = document.getElementById('cakeObstacle');
            const minion = document.getElementById('minionRunner');
            let cakePos = 400; // Стартовая позиция торта (за краем)

            gameInterval = setInterval(() => {
                cakePos -= 6; // Скорость торта
                
                // Если торт улетел влево
                if (cakePos < -40) {
                    cakePos = 380; // Возвращаем на старт
                    score++;
                    document.getElementById('score').innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        document.getElementById('highScore').innerText = highScore;
                    }
                }
                cake.style.left = cakePos + 'px'; // Двигаем торт

                // --- Проверка столкновения ---
                // Получаем текущую высоту миньона
                const minionBottom = parseInt(window.getComputedStyle(minion).getPropertyValue('bottom'));
                
                // Условия столкновения (торт в зоне миньона AND миньон не прыгнул)
                if (cakePos > 20 && cakePos < 65 && minionBottom < 45) {
                    // Столкновение! Сброс.
                    score = 0;
                    document.getElementById('score').innerText = score;
                    cakePos = 380; // Торт на старт
                    
                    // Небольшой эффект сброса (конфетти)
                    confetti({ particleCount: 20, spread: 30, origin: { y: 0.9 } });
                }
            }, 20); // Частота обновления (fps)
        }
    </script>
</body>
</html>
