<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>с др, опг минон роднуля🎉</title>
    <!-- Подключаем конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        /* --- Плывущий фон с миньонами --- */
        .background-minions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.25;
            background-image: url('110647-birthday-minions-free-png-hq.png');
            background-size: 110px;
            animation: moveBackground 20s linear infinite;
        }

        @keyframes moveBackground {
            from { background-position: 0 0; }
            to { background-position: 100% 100%; }
        }

        /* --- Основная карточка --- */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
            z-index: 1;
            position: relative;
        }

        .main-media {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 16px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 { color: #fbc02d; font-size: 26px; margin: 10px 0; }
        h2 { font-size: 20px; color: #555; margin-bottom: 20px; }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            min-height: 60px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        #yesBtn { background-color: #4caf50; color: white; }
        #noBtn { background-color: #f44336; color: white; }

        /* --- Экран успеха с игрой --- */
        #successScreen { display: none; }

        .game-box {
            position: relative;
            width: 100%;
            height: 200px;
            background: #e0f7fa;
            border-radius: 15px;
            border: 3px solid #fbc02d;
            overflow: hidden;
            margin-top: 15px;
            touch-action: manipulation;
        }

        #minionRunner {
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 10px;
            left: 20px;
            z-index: 2;
            object-fit: contain;
        }

        #cakeObstacle {
            width: 40px;
            height: 40px;
            position: absolute;
            bottom: 10px;
            right: -40px;
            z-index: 1;
            object-fit: contain;
        }

        .jump { animation: jumpAnim 0.6s ease-out; }

        @keyframes jumpAnim {
            0% { bottom: 10px; }
            50% { bottom: 100px; }
            100% { bottom: 10px; }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Плывущий фон -->
    <div class="background-minions"></div>

    <!-- Основной экран открытки -->
    <div class="container" id="mainCard">
        <div>
            <!-- Картинка/видео на главной -->
            <img class="main-media" id="mainGif" src="110647-birthday-minions-free-png-hq.png" alt="Миньоны">
        </div>

        <h1>открытка для ари</h1>
        <h2>арыйагын чи не</h2>

        <div class="btn-group">
            <button id="yesBtn" onclick="acceptGreeting()">до)))</button>
            <button id="noBtn" onclick="rejectGreeting()">нит(((</button>
        </div>
    </div>

    <!-- Экран успеха с новым видео и игрой -->
    <div class="container" id="successScreen">
        <div>
            <!-- Новое видео с кнопками управления и звуком -->
            <video class="main-media" id="congratVideo" loop playsinline controls style="width: 100%; height: auto; max-height: 220px; border-radius: 16px;">
                <source src="VID_20260828_160355_612.mp4" type="video/mp4">
            </video>
        </div>

        <h1>уроо с др тебя ари 🥳💛</h1>
        <p style="font-size: 18px; color: #555; margin: 10px 0;">всего крутого те, любви, денег и здоровья</p>
        
        <p style="font-size: 14px; color: #666; margin-top: 15px;">тапай по голубому полю, шобы минон прыгал</p>

        <div class="score-board">
            <div>Счет: <span id="score">0</span></div>
            <div>Рекорд: <span id="highScore">0</span></div>
        </div>

        <!-- Игровое поле -->
        <div class="game-box" id="gameArea" onclick="jump()">
            <img id="minionRunner" src="Picsart_26-08-28_08-20-28-420.png" alt="Миньон">
            <img id="cakeObstacle" src="pngtree-cake-png-image_6224339.png" alt="Торт">
        </div>
    </div>

    <script>
        let yesScale = 1;

        function rejectGreeting() {
            yesScale += 0.3;
            document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;
        }

        function acceptGreeting() {
            // Прячем открытку, показываем экран с видео и игрой
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';

            // Автоматически запускаем видео
            const video = document.getElementById('congratVideo');
            if (video) {
                video.play().catch(e => console.log("Video play error:", e));
            }

            // Эффект конфетти
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });

            // Запускаем игру
            startGame();
        }

        // --- Логика игры ---
        let score = 0;
        let highScore = 0;
        let isJumping = false;
        let gameInterval;

        function jump() {
            const minion = document.getElementById('minionRunner');
            if (!isJumping) {
                isJumping = true;
                minion.classList.add('jump');
                setTimeout(() => {
                    minion.classList.remove('jump');
                    isJumping = false;
                }, 600);
            }
        }

        function startGame() {
            const cake = document.getElementById('cakeObstacle');
            const minion = document.getElementById('minionRunner');
            let cakePos = 350;

            gameInterval = setInterval(() => {
                cakePos -= 5;
                
                if (cakePos < -40) {
                    cakePos = 350;
                    score++;
                    document.getElementById('score').innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        document.getElementById('highScore').innerText = highScore;
                    }
                }
                cake.style.left = cakePos + 'px';

                const minionBottom = parseInt(window.getComputedStyle(minion).getPropertyValue('bottom'));
                
                if (cakePos > 20 && cakePos < 60 && minionBottom < 40) {
                    score = 0;
                    document.getElementById('score').innerText = score;
                    cakePos = 350;
                }
            }, 20);
        }
    </script>
</body>
</html>
