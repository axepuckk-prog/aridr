<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения, Ари! 🎉</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
        }

        img {
            max-width: 220px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 {
            color: #fbc02d;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            font-size: 26px;
            margin: 10px 0;
        }

        h2 {
            font-size: 20px;
            color: #555;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            box-shadow: 0 4px 10px rgba(244, 67, 54, 0.3);
        }

        /* Экран успеха и игра */
        #successScreen {
            display: none;
        }

        .game-box {
            position: relative;
            width: 100%;
            height: 200px;
            background: #e0f7fa;
            border-radius: 15px;
            border: 3px solid #fbc02d;
            overflow: hidden;
            margin-top: 15px;
            touch-action: manipulation;
        }

        #minionRunner {
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 10px;
            left: 20px;
            background-image: url('https://media.tenor.com/71239O9p98AAAAAi/minion-minions.gif');
            background-size: cover;
        }

        #cakeObstacle {
            width: 35px;
            height: 35px;
            position: absolute;
            bottom: 10px;
            right: -40px;
            background-image: url('https://media.tenor.com/83p1y3U0f1AAAAAi/birthday-cake.gif');
            background-size: cover;
        }

        .jump {
            animation: jumpAnim 0.6s ease-out;
        }

        @keyframes jumpAnim {
            0% { bottom: 10px; }
            50% { bottom: 100px; }
            100% { bottom: 10px; }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <div>
            <!-- Конвертик / гифка с миньоном -->
            <img id="mainGif" src="https://media.tenor.com/S_THbhLJxokAAAAj/envelope-cora%C3%A7%C3%A3o-envelope.gif" alt="Envelope">
        </div>

        <h1 id="titleText">💌 Открытка для Ари! 🎂</h1>
        <h2 id="subtitleText">Примешь поздравление? ✨</h2>

        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" onclick="acceptGreeting()">Да! 🎉</button>
            <button id="noBtn" onclick="rejectGreeting()">Нет 😜</button>
        </div>
    </div>

    <!-- Экран после нажатия "Да" -->
    <div class="container" id="successScreen">
        <h1>Урааа! С Днём Рождения, Ари! 🥳💛</h1>
        <p style="font-size: 18px; line-height: 1.5;">
            Желаю моря бананов, улыбок, веселья и чтобы все мечты сбывались! 🍌✨
        </p>
        
        <div>
            <img src="https://media.tenor.com/83p1y3U0f1AAAAAi/birthday-cake.gif" alt="Minion Party">
        </div>

        <p style="font-size: 14px; color: #666;">Тапай по полю, чтобы миньон прыгал через тортики!</p>

        <div class="score-board">
            <div>Счет: <span id="score">0</span></div>
            <div>Рекорд: <span id="highScore">0</span></div>
        </div>

        <div class="game-box" id="gameArea" onclick="jump()">
            <div id="minionRunner"></div>
            <div id="cakeObstacle"></div>
        </div>
    </div>

    <script>
        let yesScale = 1;
        let noClicks = 0;
        const noTexts = ["Уверена?", "Точно нет?", "Подумай ещё!", "Эй, Ари! 🍌", "Жми ДА!"];

        function rejectGreeting() {
            noClicks++;
            // Увеличиваем кнопку ДА
            yesScale += 0.35;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.style.transform = `scale(${yesScale})`;

            // Меняем текст на кнопке НЕТ
            const noBtn = document.getElementById('noBtn');
            if (noClicks < noTexts.length) {
                noBtn.innerText = noTexts[noClicks];
            } else {
                noBtn.innerText = "Без вариантов! 😂";
            }

            // Меняем гифку на недоумевающего миньона
            document.getElementById('mainGif').src = "https://media.tenor.com/N2s132m82XAAAAAi/minion-what.gif";
        }

        function acceptGreeting() {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';

            // Конфетти
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            startGame();
        }

        // --- Логика игры с прыгающим миньоном ---
        let score = 0;
        let highScore = 0;
        let isJumping = false;
        let gameInterval;

        function jump() {
            const minion = document.getElementById('minionRunner');
            if (!isJumping) {
                isJumping = true;
                minion.classList.add('jump');
                setTimeout(() => {
                    minion.classList.remove('jump');
                    isJumping = false;
                }, 600);
            }
        }

        function startGame() {
            const cake = document.getElementById('cakeObstacle');
            const minion = document.getElementById('minionRunner');
            let cakePos = 400;

            gameInterval = setInterval(() => {
                cakePos -= 5;
                if (cakePos < -40) {
                    cakePos = 350;
                    score++;
                    document.getElementById('score').innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        document.getElementById('highScore').innerText = highScore;
                    }
                }
                cake.style.right = (350 - cakePos) + 'px';

                // Проверка столкновения
                const minionBottom = parseInt(window.getComputedStyle(minion).getPropertyValue('bottom'));
                if (cakePos > 20 && cakePos < 70 && minionBottom < 45) {
                    score = 0;
                    document.getElementById('score').innerText = score;
                    cakePos = 350;
                }
            }, 20);
        }
    </script>
</body>
</html>
